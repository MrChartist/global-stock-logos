name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Logo quality check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Audit logos (invalid XML, placeholders, empty logos)
        run: node scripts/quality.js --check
