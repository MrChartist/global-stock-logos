name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  logo-sources:
    name: Logo sources (pull requests only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Reject forbidden logo sources and logos that fail logo-tool check
        run: node scripts/check-logo-sources.js --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}

  quality:
    name: Logo quality check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Logos, data, API and client (XML, ids, ISIN, URLs, schema of every company file, types, client tests)
        run: npm test

  frontend:
    name: Catalogue page (browser test and Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Browser test (desktop and phone, including hostile-data test)
        run: node scripts/test-frontend.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lighthouse (performance, accessibility, best practices, SEO; light and dark; mobile and desktop)
        run: node scripts/lighthouse.js --min 95
        env:
          CHROME_PATH: /usr/bin/google-chrome
