name: Daily Logo Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Add new listings, repair quality, rebuild manifests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Download logos for new listings (real logos only)
        run: node scripts/bulk-crawl.js
      - name: Repair quality issues
        run: node scripts/quality.js --fix
      - name: Rebuild manifests and search index
        run: node scripts/sync.js
      - name: Rebuild the static API
        run: node scripts/build-api.js
      - name: Final checks
        run: node scripts/quality.js --check && node scripts/validate-api.js
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(catalog): daily sync of new listings and manifests [skip ci]"
          file_pattern: "api logos manifests logos-manifest.json search-index.json companies-metadata.json logo-sources.json quality-report.json"
