name: Monthly Data Refresh

# Refreshes logos, market data and company profiles. Runs on the 1st of each month.
# "Auto finish": the pipeline is resumable. If it runs out of time before everything is refreshed,
# it commits its progress and starts itself again (up to 8 times) until pipeline-status.json says complete.
on:
  schedule:
    - cron: '30 3 1 * *'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Continuation number (set automatically)'
        required: false
        default: '1'

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh (attempt ${{ inputs.attempt || '1' }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - name: Run the pipeline
        id: pipeline
        run: |
          set +e
          node scripts/run-all.js --max-minutes 320
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit progress
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): monthly refresh, attempt ${{ inputs.attempt || '1' }} [skip ci]"
          file_pattern: "logos png enrichment manifests logos-manifest.json search-index.json companies-metadata.json logo-sources.json quality-report.json data-quality-report.json pipeline-status.json"
      - name: Continue if not finished
        if: steps.pipeline.outputs.code == '2' && fromJSON(inputs.attempt || '1') < 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monthly-refresh.yml -f attempt=$(( ${{ inputs.attempt || 1 }} + 1 ))
      - name: Fail on a real error
        if: steps.pipeline.outputs.code == '1'
        run: |
          echo "Pipeline step or data validation failed. See pipeline-status.json and data-quality-report.json."
          exit 1
